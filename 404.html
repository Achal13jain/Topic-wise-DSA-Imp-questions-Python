<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#15171C" />
  <title>Page not found · DSA Interview Prep</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <style>
    :root{color-scheme:dark;--ink:#15171c;--paper:#f2f3ef;--signal:#5468ff;--muted:#a6aab4}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:Inter,system-ui,-apple-system,sans-serif;padding:24px}
    main{width:min(680px,100%);text-align:center}
    .mark{width:92px;height:92px;margin:0 auto 28px}
    .code{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.18em;color:#8e93ff}
    h1{font-size:clamp(42px,8vw,72px);line-height:1.05;margin:14px 0 18px;letter-spacing:-.03em}
    p{color:var(--muted);font-size:18px;line-height:1.65;margin:0 auto 30px;max-width:48ch}
    a{display:inline-flex;background:var(--signal);color:#fff;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:999px}
    a:focus-visible{outline:3px solid #fff;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <img class="mark" src="/assets/favicon.svg" alt="" />
    <div class="code">404 · DEAD END</div>
    <h1>This path has no solution.</h1>
    <p>The page may have moved, but the DSA atlas is still ready to help you find the right pattern.</p>
    <a href="/">Return to the atlas</a>
  </main>
</body>
</html>
